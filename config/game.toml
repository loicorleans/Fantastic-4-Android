# argument locations in API order for functions a link time code generated library compiled with another
# convention: a register (eax ebx ecx edx esi edi ebp) or "stack" for the next stack slot, which the callee pops
[abi]

# XACTENG and XPP read the APU's 48 kHz sample counter straight from 0xFE80200C, which has no host memory behind it.
# the hooks put a counter from the host clock in the register and jump over the load.
[[hook]]
at = 0x16676A        # XACTENG: mov eax, ds:0xFE80200C
call = "ApuSampleClockEax"
on_true = 0x16676F

[[hook]]
at = 0x196496        # XPP: mov ebx, ds:0xFE80200C
call = "ApuSampleClockEbx"
on_true = 0x19649C
